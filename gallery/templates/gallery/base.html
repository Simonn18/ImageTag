{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Galerie d'images{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'gallery/css/style.css' %}">
</head>
<body>
    <div class="shell">
        <header class="site-header">
            <a class="brand" href="{% url 'gallery:list' %}">
                <span class="brand-mark" aria-hidden="true">G</span>
                <span><strong>Galerie d'images</strong><small>Collection personnelle</small></span>
            </a>
            <nav aria-label="Navigation principale">
                <a href="{% url 'gallery:list' %}">Explorer</a>
                <a href="{% url 'gallery:upload' %}">Ajouter</a>
            </nav>
        </header>
        {% if messages %}
            <ul class="messages" aria-live="polite">
                {% for message in messages %}<li>{{ message }}</li>{% endfor %}
            </ul>
        {% endif %}
        <main>{% block content %}{% endblock %}</main>
    </div>
</body>
</html>
